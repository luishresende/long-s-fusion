# Fine-tune of PP-OCRv6_medium_rec (PaddleOCR 3.7 configs/rec/PP-OCRv6/PP-OCRv6_medium_rec.yml); only the changes are commented.
# `ſ` is dictionary index 314, row 315 of the 18,710-class CTC projection; the dictionary is kept.
#
# Run:
#   python3 tools/train.py -c PP-OCRv6_medium_rec_hist.yml \
#       -o Global.pretrained_model=./PP-OCRv6_medium_rec_pretrained.pdparams

Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  # 100 -> 20: fine-tune, not training from scratch
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/PP-OCRv6_medium_rec_hist
  save_epoch_step: 1          # 10 -> 1: one checkpoint per epoch, for the curve
  eval_batch_step: [0, 1000]  # evaluates twice as often
  cal_metric_during_train: true
  pretrained_model:           # pass it on the command line (-o Global.pretrained_model=...)
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt   # official dictionary, kept
  # 25 -> 100: longer labels are dropped (label_ops.py:157); 100 covers 99.8% of the lines
  max_text_length: &max_text_length 100
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/rec/predicts_ppocrv6_medium_hist.txt
  d2s_train_image_shape: [3, 48, 960]


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    # 0.0005 -> 5.0e-05: the docs' fine-tuning range, [5e-5, 1e-5] at batch 64 and [1e-4, 2e-5] at 128
    learning_rate: 5.0e-05
    warmup_epoch: 1           # 5 -> 1: a long warmup makes no sense in 20 epochs
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./train_data/
    ext_op_transform_idx: 1
    label_file_list:
    - ./train_data/train_list.txt
    # 0.5 -> 1.0: every line in every epoch
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    # RecConAug removed, as the fine-tune docs advise for simple scenes
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    # 320 -> 960: CTC steps are width / 8, and 40 steps cannot emit a 60-character line
    scales: [[960, 32], [960, 48], [960, 64]]
    first_bs: &bs 12   # 64 -> 12: the CTC output triples in size with the 960 window
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list:
    - ./train_data/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 960]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
